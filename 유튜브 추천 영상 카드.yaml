type: grid
cards:
  - type: heading
    heading: 🎬 유튜브 추천 영상
    heading_style: title
  - type: custom:simple-swipe-card
    swipe_direction: horizontal
    loop_mode: none
    card_spacing: 10
    show_pagination: true
    cards:
      - type: custom:button-card
        entity: sensor.youtube_recommended
        show_name: false
        show_state: false
        tap_action:
          action: url
          url_path: >
            [[[ const v =
            states['sensor.youtube_recommended'].attributes.videos;
                return v && v.length > 1 ? v[1].url : '#' ]]]
        custom_fields:
          thumbnail: >
            [[[ const v =
            states['sensor.youtube_recommended'].attributes.videos;
                return v && v.length > 1
                  ? `<img src="${v[1].thumbnail}" style="width:100%;height:100%;object-fit:cover;">`
                  : '' ]]]
          title: >
            [[[ const v =
            states['sensor.youtube_recommended'].attributes.videos;
                return v && v.length > 1
                  ? `<div style="color:white;font-weight:bold;font-size:16px;position:absolute;bottom:60px;left:10px;text-shadow:1px 1px 3px rgba(0,0,0,0.7);">${v[1].title}</div>`
                  : '' ]]]
          channel: >
            [[[ const v =
            states['sensor.youtube_recommended'].attributes.videos;
                return v && v.length > 1
                  ? `<div style="color:white;font-size:12px;position:absolute;bottom:40px;left:10px;text-shadow:1px 1px 3px rgba(0,0,0,0.7);">${v[1].channel}</div>`
                  : '' ]]]
          duration: >
            [[[ const v =
            states['sensor.youtube_recommended'].attributes.videos;
                return v && v.length > 1
                  ? `<div style="color:white;font-size:12px;position:absolute;bottom:20px;left:10px;text-shadow:1px 1px 3px rgba(0,0,0,0.7);">${v[1].duration}</div>`
                  : '' ]]]
        styles:
          card:
            - height: 350px
            - padding: 0
          custom_fields:
            thumbnail:
              - position: absolute
              - top: 0
              - left: 0
      - type: custom:button-card
        entity: sensor.youtube_recommended
        show_name: false
        show_state: false
