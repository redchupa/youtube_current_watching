type: grid
cards:
  - type: heading
    heading_style: title
    heading: 🎬 유튜브 영상 재생 (현재창)
  - type: custom:button-card
    entity: none
    show_name: false
    show_state: false
    styles:
      card:
        - width: 100%
        - padding: 0
      custom_fields:
        video_player:
          - width: 490px
    custom_fields:
      video_player:
        card: |
          [[[
            // sensor.youtube_recommended 엔티티에서 영상 목록 가져오기
            const yt = states['sensor.youtube_recommended'];
            const videos = yt?.attributes?.videos;

            let videoId = '';

            // 항상 첫 번째 영상만 사용
            if (videos && videos.length > 0) {
              const video = videos[0];

              // video_id 필드가 있으면 그대로 사용
              if (video.video_id) {
                videoId = video.video_id;
              }
              // 없으면 URL에서 v= 뒤 값을 추출
              else if (video.url?.includes('v=')) {
                videoId = video.url.split('v=')[1]?.split('&')[0] || '';
              }
            }

            // video_id가 없거나 비정상일 경우 표시
            if (!videoId || videoId.length !== 11) {
              return {
                type: "markdown",
                content: "첫 번째 추천 영상을 불러올 수 없습니다."
              };
            }

            // 첫 번째 추천영상 표시
            return {
              type: "custom:youtube-video-card",
              video_id: videoId,
              autoplay: false,
              controls: true
            };
          ]]]
